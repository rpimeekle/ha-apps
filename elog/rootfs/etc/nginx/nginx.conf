# Ingress reverse proxy for ELOG.
# Home Assistant serves the app under /api/hassio_ingress/<token>/ and tells us
# that prefix in the X-Ingress-Path header. elogd assumes it lives at "/", so we
# rewrite redirects, cookies and root-relative links on the way out.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    # One line per request, so stalls and errors show in the app log
    log_format ingress '[proxy] from=$remote_addr "$request" $status '
                       'upstream=$upstream_status time=${upstream_response_time}s '
                       'ingress_path="$http_x_ingress_path"';
    access_log /dev/stdout ingress;
    server_tokens off;
    client_max_body_size 200m;

    server {
        listen 8099 default_server;

        # Keep rewritten redirects relative ("/api/hassio_ingress/<token>/...").
        # Without this nginx expands them to http://<internal-host>:8099/...,
        # which the browser can't reach, and the panel spins forever.
        absolute_redirect off;

        # Port 8099 is not published on the host, so it is only reachable from
        # inside Home Assistant. Allow the whole internal network rather than
        # one hard-coded gateway address: Supervisor (172.30.32.x) and apps
        # (172.30.33.x), plus localhost for the start-up self-test.
        allow 127.0.0.1;
        allow 172.30.32.0/23;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $http_host;
            proxy_set_header Connection close;      # elogd is a simple HTTP/1.0-style server
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";   # sub_filter needs plain bodies
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;                 # surface a hang as a 504, not an endless spinner

            # Never let upstream headers stop the page rendering inside the HA panel
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_buffering on;

            # 302 Location: http://host/General/  or  /General/
            proxy_redirect ~^https?://[^/]+/(.*)$ $http_x_ingress_path/$1;
            proxy_redirect ~^/(.*)$ $http_x_ingress_path/$1;

            # Login cookies are path-scoped
            proxy_cookie_path ~^/(.*)$ $http_x_ingress_path/$1;

            # Absolute and root-relative links inside pages
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript
                             text/xml application/xml application/rss+xml;
            sub_filter 'http://$http_host/'  '$http_x_ingress_path/';
            sub_filter 'href="/'             'href="$http_x_ingress_path/';
            sub_filter 'src="/'              'src="$http_x_ingress_path/';
            sub_filter 'action="/'           'action="$http_x_ingress_path/';
            sub_filter "href='/"             "href='$http_x_ingress_path/";
            sub_filter "src='/"              "src='$http_x_ingress_path/";
            sub_filter 'url(/'               'url($http_x_ingress_path/';

            # Written by run.sh (rewrites the configured external URL, if any)
            include /run/elog-ingress-extra.conf;
        }
    }
}
