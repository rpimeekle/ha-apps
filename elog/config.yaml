# https://developers.home-assistant.io/docs/apps/configuration
name: ELOG
version: "1.1.0"
slug: elog
description: Lightweight PSI ELOG electronic logbook server
url: https://github.com/__GH_USER__/__GH_REPO__/tree/main/elog
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true

# Sidebar panel through Home Assistant ingress
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-edit-outline
panel_title: ELOG

# Optional direct access (needed for users without a HA login).
# Clear the port in the app's Network settings to disable it.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: ELOG web interface (direct, bypasses Home Assistant login)
webui: "http://[HOST]:[PORT:8080]/"

map:
  - addon_config:rw

# Uncomment once the GitHub Action has published the image and the GHCR
# package is public. Without it, Home Assistant builds the image locally.
# image: "ghcr.io/__GH_USER_LC__/elog"

options:
  logbooks:
    - name: General
      description: General purpose logbook
  authentication: false
  admin_user: admin
  self_register: 1
  manage_config: true
schema:
  logbooks:
    - name: "match(^[A-Za-z0-9][A-Za-z0-9 _.-]{0,63}$)"
      description: str?
  authentication: bool
  admin_user: str?
  self_register: list(0|1|2|3)
  url: url?
  manage_config: bool
