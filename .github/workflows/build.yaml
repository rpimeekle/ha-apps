name: Build

on:
  push:
    branches: [main]
    paths: ["elog/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["elog/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ELOG (amd64 + aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read app metadata
        id: info
        run: |
          echo "version=$(yq '.version' elog/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/elog" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: elog
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BUILD_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
