name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  init:
    name: Find changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every top-level folder with a config.yaml is an app
          all=$(find . -mindepth 2 -maxdepth 2 -name config.yaml -printf '%h\n' | sed 's|^\./||' | sort)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            apps="$all"
          else
            # First push / unknown base: build everything
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null || echo ".github/workflows/")
            if grep -q '^\.github/workflows/' <<< "$changed"; then
              apps="$all"
            else
              apps=$(for a in $all; do if grep -q "^$a/" <<< "$changed"; then echo "$a"; fi; done)
            fi
          fi
          json=$(printf '%s\n' $apps | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Apps to build: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5

      - name: Read app metadata
        id: info
        run: |
          echo "version=$(yq '.version' '${{ matrix.app }}/config.yaml')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(yq '.slug' '${{ matrix.app }}/config.yaml')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BUILD_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
