# TrueNAS web UI behind Home Assistant ingress.
#
# Everything is proxied to TrueNAS. Two things are rewritten in index.html:
#   - <base href="/ui/"> gets the panel prefix, so Angular's routes and assets
#     stay inside the panel;
#   - a small script is injected that prefixes root-relative websocket, upload
#     and download URLs (see /usr/share/ha-ingress/shim.js).
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Written by run.sh: request logging on or off (log_requests option)
    include /run/truenas/logging.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099 default_server;
        absolute_redirect off;

        # Port 8099 is not published on the host: only reachable from inside
        # Home Assistant (Supervisor 172.30.32.x, apps 172.30.33.x) and
        # localhost for the start-up self-test.
        allow 127.0.0.1;
        allow 172.30.32.0/23;
        deny all;

        client_max_body_size 0;              # uploads (config restore, update images)

        location / {
            # Written by run.sh: proxy_pass, Host/Origin, TLS verification
            include /run/truenas/upstream.conf;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Accept-Encoding "";  # sub_filter needs plain bodies
            proxy_read_timeout 1d;                # websocket API and shell
            proxy_send_timeout 1d;
            proxy_request_buffering off;
            proxy_buffering off;

            # Let the page render inside the Home Assistant panel, and don't pin
            # HSTS onto the Home Assistant hostname
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Strict-Transport-Security;

            # TrueNAS redirects with absolute URLs (https://truenas/ui/)
            proxy_redirect ~^https?://[^/]+(/.*)$ $http_x_ingress_path$1;
            proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;
            proxy_cookie_path / $http_x_ingress_path/;

            sub_filter '<base href="/ui/">' '<base href="$http_x_ingress_path/ui/">';
            include /run/truenas/inject.conf;  # sub_filter '<head>' -> '<head><script>…'
            sub_filter_once on;
        }
    }
}
