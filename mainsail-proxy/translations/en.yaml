configuration:
  moonraker_url:
    name: Moonraker URL
    description: Address of your Moonraker server, e.g. http://192.168.1.50:7125. Use an IP address rather than a .local name.
  moonraker_api_key:
    name: Moonraker API key
    description: Optional. Only needed if Moonraker doesn't trust your Home Assistant machine's IP (see the Documentation tab).
  webcam_url:
    name: Webcam URL
    description: Optional. Leave empty to detect the camera from Mainsail's webcam settings, or enter the camera's base address, e.g. http://192.168.1.50:8080/.
  log_requests:
    name: Log requests
    description: Write one log line per request. Useful for troubleshooting; leave off otherwise.
