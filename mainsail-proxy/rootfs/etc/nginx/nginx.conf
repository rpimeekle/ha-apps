# Mainsail behind Home Assistant ingress.
#
# Serves a patched Mainsail bundle and proxies Moonraker's API and websocket.
# Root-relative paths in the bundle carry the placeholder /__HA_INGRESS__,
# replaced here with the X-Ingress-Path header Home Assistant sends.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Written by run.sh: request logging on or off (log_requests option)
    include /run/mainsail/logging.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    server {
        listen 8099 default_server;
        absolute_redirect off;

        # Port 8099 is not published on the host: only reachable from inside
        # Home Assistant (Supervisor 172.30.32.x, apps 172.30.33.x) and
        # localhost for the start-up self-test.
        allow 127.0.0.1;
        allow 172.30.32.0/23;
        deny all;

        root /var/www/mainsail;
        client_max_body_size 0;          # G-code uploads can be large

        # ---- Mainsail web app --------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;   # SPA routes (history mode)

            sub_filter '/__HA_INGRESS__' '$http_x_ingress_path';
            sub_filter_once off;
            sub_filter_types text/css application/javascript text/javascript;

            # The ingress token changes per session, so never cache patched files
            add_header Cache-Control "no-store" always;
        }

        # A placeholder that slipped through unreplaced still resolves
        location ^~ /__HA_INGRESS__/ {
            rewrite ^/__HA_INGRESS__(/.*)$ $1 last;
        }

        # Tells Mainsail to talk to Moonraker through this same panel path
        location = /config.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"defaultLocale":"en","defaultMode":"dark","defaultTheme":"mainsail","hostname":null,"port":null,"path":"$http_x_ingress_path","instancesDB":"moonraker","instances":[]}';
        }

        # ---- Moonraker ---------------------------------------------------
        location = /websocket {
            include /run/mainsail/moonraker.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            include /run/mainsail/moonraker.conf;
            proxy_request_buffering off;     # stream uploads straight through
            proxy_buffering off;             # stream downloads and logs
            proxy_read_timeout 600s;
        }

        # ---- Optional webcam (webcam_url option) -------------------------
        include /run/mainsail/webcam.conf;
    }
}
