# Managed by the DokuWiki app - regenerated parts live in /etc/nginx/includes
user nginx;
worker_processes 1;
pid /run/nginx.pid;
daemon off;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    access_log off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Home Assistant ingress (sidebar). Only the Supervisor may connect.
    server {
        listen 8099 default_server;
        allow 172.30.32.2;
        deny all;

        set $ha_ingress 1;
        include /etc/nginx/includes/dokuwiki.conf;
    }

    # Optional direct access (only reachable if a host port is set).
    server {
        listen 80 default_server;

        set $ha_ingress 0;
        include /etc/nginx/includes/dokuwiki.conf;
    }
}
