; Managed by the DokuWiki app
[www]
user = nginx
group = nginx

listen = /run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; Lightweight: no idle workers, spawn on demand
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
