# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: DokuWiki
version: "1.0.0"
slug: dokuwiki
description: Lightweight, database-free wiki that lives in your Home Assistant sidebar
url: "https://github.com/rpimeekle/ha-dokuwiki/tree/main/dokuwiki"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Sidebar access through Home Assistant (no extra port, HA login required)
ingress: true
ingress_port: 8099
panel_icon: mdi:book-open-page-variant
panel_title: Wiki

# Optional direct access from your LAN (disabled by default)
ports:
  80/tcp: null
ports_description:
  80/tcp: Direct web access (optional - leave empty to use the sidebar only)

# Wiki pages, media, users, settings and plugins are stored here.
# Visible as /addon_configs/<id>_dokuwiki via Samba / File editor and
# included in backups of this app.
map:
  - type: addon_config
    read_only: false

options:
  upload_limit_mb: 64
  memory_limit_mb: 256
schema:
  upload_limit_mb: int(1,2048)
  memory_limit_mb: int(64,4096)

# Uncomment once you publish prebuilt images (see repository README)
# image: "ghcr.io/rpimeekle/ha-dokuwiki"
